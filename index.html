<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1e1f22" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="DisTorrent — comunicação P2P descentralizada, local-first e cifrada fim-a-fim." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>DisTorrent — conversa P2P, sem servidor</title>
    <meta property="og:title" content="DisTorrent" />
    <meta property="og:description" content="Chat, voz e arquivos direto entre aparelhos. Sem conta online, sem nuvem, cifrado fim-a-fim." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>html,body{margin:0;height:100%;background:#1e1f22}#splash{height:100vh;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;font-family:Inter,system-ui,sans-serif;color:#dbdee1}#splash .logo{font-size:26px;font-weight:900;letter-spacing:1px;color:#f2f3f5}#splash .bar{width:180px;height:4px;border-radius:99px;background:#2b2d31;overflow:hidden}#splash .bar i{display:block;height:100%;width:40%;border-radius:99px;background:#5865f2;animation:sl 1.1s infinite ease-in-out}@keyframes sl{0%{transform:translateX(-100%)}100%{transform:translateX(450%)}}@media(prefers-reduced-motion:reduce){#splash .bar i{animation:none}}</style>
  </head>
  <body>
    <div id="root"><div id="splash"><div class="logo">DisTorrent</div><div class="bar"><i></i></div><div style="font-size:12px;color:#949ba4">abrindo mensageiro P2P…</div></div></div>
    <noscript><div style="height:100vh;display:flex;align-items:center;justify-content:center;font-family:sans-serif;color:#dbdee1;background:#1e1f22;text-align:center;padding:24px">O DisTorrent precisa de JavaScript para cifrar e enviar mensagens entre aparelhos.</div></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
