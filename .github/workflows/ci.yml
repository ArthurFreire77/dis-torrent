name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (typecheck + lint + unit + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22.6+ por causa de node --experimental-strip-types (npm run test:unit)
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build

  core:
    name: forge-core (fmt + test + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: forge-core
      - name: Dependências de sistema (SQLite bundled, ALSA/Opus, glib)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev pkg-config build-essential cmake \
            libglib2.0-dev libdbus-1-dev
      - run: cargo fmt --check
        working-directory: forge-core
      - run: cargo test
        working-directory: forge-core
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: forge-core

  host:
    name: host (check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host
      # O host depende de forge-core, que puxa gstreamer (precisa de glib-dev)
      # e cpal/opus (precisa de ALSA). Sem isto, glib-sys falha no build script.
      - name: Dependências de sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev pkg-config build-essential cmake \
            libglib2.0-dev libdbus-1-dev
      - run: cargo check
        working-directory: host

  desktop-linux:
    name: Desktop Linux (.deb + .AppImage)
    runs-on: ubuntu-latest
    needs: [web, core]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Dependências de sistema (WebKitGTK 4.1)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libasound2-dev pkg-config build-essential cmake \
            libglib2.0-dev libdbus-1-dev
      - run: npm ci
      - run: npm run tauri:build
      - uses: actions/upload-artifact@v4
        with:
          name: distorrent-linux
          path: src-tauri/target/release/bundle/**/*
          if-no-files-found: error

  desktop-windows:
    name: Desktop Windows (.msi + .exe)
    runs-on: windows-latest
    needs: [web, core]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run tauri:build
      - uses: actions/upload-artifact@v4
        with:
          name: distorrent-windows
          path: src-tauri/target/release/bundle/**/*
          if-no-files-found: error

  # Android e macOS ficam de fora por enquanto:
  # - Android exige keystore de release em GitHub Secrets (ver EXECUTAR.md).
  # - macOS exige conta Apple Developer para assinatura e notarizacao.
  # Descomente quando tiver as credenciais:
  #
  # desktop-macos:
  #   name: Desktop macOS (.dmg)
  #   runs-on: macos-latest
  #   needs: [web, core]
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-node@v4
  #     -   with: { node-version: 22, cache: npm }
  #     - uses: dtolnay/rust-toolchain@stable
  #     - run: npm ci
  #     - run: npm run tauri:build
  #     - uses: actions/upload-artifact@v4
  #     -   with:
  #     -     name: distorrent-macos
  #     -     path: src-tauri/target/release/bundle/**/*
  #     -     if-no-files-found: error