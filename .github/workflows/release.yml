name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (.exe portátil)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # EXECUTÁVEL PORTÁTIL, sem instalador — de propósito.
      # O instalador NSIS (`--bundles nsis`) cai num falso positivo do Defender
      # (`Program:Win32/Contebrew.A!ml`): o navegador bloqueia o download e o
      # arquivo vai para a quarentena. Trocar compressão (LZMA→zlib) não resolve.
      # O binário puro passa limpo até baixado com Mark-of-the-Web.
      # `--no-bundle` compila o app (frontend + Rust) sem gerar instalador.
      - run: npm run tauri build -- --no-bundle
      - name: Renomear executável portátil
        shell: bash
        run: |
          set -euo pipefail
          V=$(node -p "require('./package.json').version")
          mkdir -p src-tauri/target/release/bundle/portable
          cp src-tauri/target/release/forge.exe \
             "src-tauri/target/release/bundle/portable/DisTorrent_${V}_x64.exe"
          ls -la src-tauri/target/release/bundle/portable
      - uses: actions/upload-artifact@v4
        with:
          # Só o executável: subir `bundle/**/*` enchia a release de lixo (o
          # AppImage deixa a árvore extraída com centenas de .so ao lado do
          # arquivo final).
          name: windows-bundle
          path: src-tauri/target/release/bundle/portable/*.exe

  build-linux:
    name: Build Linux (.AppImage + .deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Dependencias de sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libasound2-dev pkg-config build-essential cmake \
            libglib2.0-dev libdbus-1-dev \
            libwayland-dev libxkbcommon-dev \
            libpipewire-0.3-dev libclang-dev clang \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev libgstrtspserver-1.0-dev \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-libav zip unzip coreutils
      - run: npm ci
      - run: npm run tauri build -- --bundles deb,appimage
      - uses: actions/upload-artifact@v4
        with:
          # Idem Windows: NUNCA subir `bundle/**/*` — em Linux ele inclui o
          # AppDir inteiro (AppRun, .typelib, libs, data.tar.gz do .deb) e a
          # release termina com centenas de assets inúteis (foi o que
          # aconteceu no run 40766045293: 293 assets).
          name: linux-bundle
          path: |
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage

  build-android:
    name: Build Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0 ndk;27.0.12077973 cmake;3.22.1
      - name: Dependencias de sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev pkg-config build-essential cmake clang
      - run: npm ci
      # NÃO rodar `tauri android init` aqui: o projeto nativo (gen/android) é
      # versionado e o init sobrescreve MainActivity.kt/build.gradle.kts — foi
      # assim que o APK do CI saiu sem a biblioteca nativa.
      # Só arm64: o runner não tem os targets rust das outras ABIs instalados e
      # um build "universal" falharia no meio (ou pior: sairia sem as .so de
      # algumas ABIs). arm64 cobre todos os aparelhos atuais.
      - run: npm run tauri android build -- --apk --target aarch64
      - name: Verificar APK (libforge_lib.so presente)
        working-directory: src-tauri/gen/android/app/build/outputs/apk
        run: |
          set -euo pipefail
          # O CI não tem o keystore do mantenedor, então o release sai
          # `app-arm64-release-unsigned.apk`. Isso é esperado: aqui verificamos
          # que o BUILD está certo (Rust + assets dentro). O APK assinado que
          # vai para o usuário é gerado localmente (AGENTS.md §0) e não é
          # anexado à release por este workflow (ver step Create release).
          mapfile -t apks < <(find . -name '*.apk' | sort)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::nenhum APK gerado"; exit 1
          fi
          for apk in "${apks[@]}"; do
            echo "== $apk ($(stat -c%s "$apk") bytes)"
            case "$apk" in
              *unsigned*) echo "::warning::$apk não está assinado (sem keystore no CI) — não instala em aparelho";;
            esac
            # APK sem a .so instala e morre no boot (UnsatisfiedLinkError):
            # é o bug publicado na 1.1.6 (APK de 2,49 MB, zero lib/).
            if [ "$(stat -c%s "$apk")" -lt 10000000 ]; then
              echo "::error::$apk menor que 10MB — Rust/assets ausentes"
              unzip -l "$apk"
              exit 1
            fi
            if ! unzip -l "$apk" | grep -Eq 'lib/[^/]+/libforge_lib\.so'; then
              echo "::error::$apk sem libforge_lib.so — o app morre no boot"
              unzip -l "$apk"
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          # `!` aqui funciona (picomatch do upload-artifact), ao contrário do
          # `files:` do action-gh-release — que aceitou o padrão de negação e
          # mesmo assim anexou o APK sem assinatura.
          name: android-bundle
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            !src-tauri/gen/android/app/build/outputs/apk/**/*unsigned*

  release:
    name: Create GitHub Release
    needs: [build-windows, build-linux, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # O NOME da release carrega o sufixo (-pre-alpha) do package.json, mas a
      # release NÃO é marcada como pre-release: `prerelease: true` fazia o
      # GitHub esconder a 1.1.7 em "Pre-releases" e nunca marcar como Latest.
      # A tag continua LIMPA (v1.1.7) — é ela que o GitHub usa para decidir.
      - name: Versão do package.json
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: DisTorrent ${{ steps.ver.outputs.version }}
          prerelease: false
          # Lista por extensão (sem glob `**/*` e sem negação): o action-gh-release
          # não suporta `!padrão` — no run anterior o APK sem assinatura acabou
          # anexado mesmo assim. O APK assinado é gerado localmente
          # (build-android.ps1) e enviado a esta release à parte.
          files: |
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.deb
            artifacts/**/*.AppImage
            artifacts/**/*.apk
          draft: false
          body: |
            Instaladores da versão `${{ steps.ver.outputs.version }}`.

            - **Windows:** executável **portátil** (`*_x64.exe`) — baixe e rode
              direto, sem instalar. O instalador NSIS cai num falso positivo do
              Defender (`Program:Win32/Contebrew.A!ml`) e o navegador bloqueia o
              download; o binário puro não é acusado.
            - **Linux:** pacote `.deb` e `.AppImage`
            - **Android:** APK arm64 assinado — gerado no build local
              (`build-android.ps1`) e anexado a esta release; o CI só valida a
              compilação (sem keystore ele produz APK não assinado, que não é
              publicado aqui).

            Detalhes em CHANGELOG.md.
