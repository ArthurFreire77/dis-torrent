[package]
name = "distorrent-host"
version = "5.3.0"
edition = "2021"
rust-version = "1.77"
description = "DisTorrent Community Host — nó headless (seed do F7)"
license = "MIT"

[dependencies]
distorrent-core = { path = "../distorrent-core" }
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "macros", "time", "sync"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "distorrent-host"
path = "src/main.rs"
