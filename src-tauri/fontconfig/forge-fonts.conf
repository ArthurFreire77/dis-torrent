<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- DisTorrent: mesmas fontes e regras do sistema, cache PRIVADO.
  Espelha /etc/fonts/fonts.conf (dirs + conf.d, que inclui 50-user.conf com
  as personalizações do usuário), mas o <cachedir> é SÓ o nosso.
  Por que: o WebKitGTK lia ~/.cache/fontconfig compartilhado; um `fc-cache`
  de outra versão (ex.: Linuxbrew 2.18 vs 2.15 do sistema) reescreve aquele
  cache num formato que o fontconfig do sistema não entende, e o
  WebKitWebProcess entra em loop infinito a 100% CPU antes do primeiro
  paint ("tela cinza" no .deb). Com cache privado, o envenenado nunca é
  lido nem escrito por nós — e ninguém mais toca no nosso. -->
<fontconfig>
	<description>DisTorrent private cache, system fonts and rules</description>

	<dir>/usr/share/fonts</dir>
	<dir>/usr/local/share/fonts</dir>
	<dir prefix="xdg">fonts</dir>
	<dir>~/.fonts</dir>

	<match target="pattern">
		<test qual="any" name="family"><string>mono</string></test>
		<edit name="family" mode="assign" binding="same"><string>monospace</string></edit>
	</match>
	<match target="pattern">
		<test qual="any" name="family"><string>sans serif</string></test>
		<edit name="family" mode="assign" binding="same"><string>sans-serif</string></edit>
	</match>
	<match target="pattern">
		<test qual="any" name="family"><string>sans</string></test>
		<edit name="family" mode="assign" binding="same"><string>sans-serif</string></edit>
	</match>
	<match target="pattern">
		<test qual="any" name="family"><string>system ui</string></test>
		<edit name="family" mode="assign" binding="same"><string>system-ui</string></edit>
	</match>

	<selectfont>
		<rejectfont><glob>*.dpkg-tmp</glob></rejectfont>
	</selectfont>
	<selectfont>
		<rejectfont><glob>*.dpkg-new</glob></rejectfont>
	</selectfont>

	<include ignore_missing="yes">/etc/fonts/conf.d</include>
	<include ignore_missing="yes">/etc/fonts/local.conf</include>

	<cachedir prefix="xdg">forge-fontconfig</cachedir>

	<config>
		<rescan><int>30</int></rescan>
	</config>

</fontconfig>
