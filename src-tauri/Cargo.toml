[package]
name = "distorent-cli"
version = "1.1.12-pre-alpha"
description = "DisTorrent CLI — ferramentas de linha de comando para o ecossistema DisTorrent"
authors = ["DisTorrent"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
# `tray-icon`: bandeja do Windows (fechar a janela = continuar recebendo, sem
# processo escondido — o ícone fica visível e sai por "Sair").
# `image-png`: decodifica o .png do ícone da bandeja em runtime (o ícone do
# bundle é decodificado em build, mas o fallback `Image::from_bytes` precisa).
tauri = { version = "2", features = ["tray-icon", "image-png"] }
keyring = "2.3"
hex = "0.4"
# SHA-256 do instalador baixado do GitHub (ver `updater.rs`): sem conferir o
# hash antes de executar, um download corrompido/interceptado viraria execução
# de binário arbitrário.
sha2 = "0.10"
base64 = "0.22"
dirs = "5.0"
distorrent-core = { path = "../distorrent-core" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
# UMA INSTÂNCIA SÓ no desktop. Sem isto, abrir um convite (`distorrent://`) com o
# app já aberto subia um SEGUNDO processo — e dois motores P2P sobre o mesmo
# SQLite brigam pelo arquivo (WAL, locks) e pela porta de escuta. A feature
# `deep-link` faz a 2ª instância entregar os argumentos à 1ª pelo plugin de
# deep-link, então o convite abre na janela existente.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# LIGA O WebRTC NO WEBCOMPATÍVEL DO LINUX. wry liga `enable_webgl`,
# `enable_webaudio` e `enable_canvas` por conta própria, mas ESQUECE do
# `enable_webrtc` — que no WebKitGTK vem DESLIGADO por padrão. Resultado:
# `typeof RTCPeerConnection === 'undefined'` dentro do app, e a chamada morre
# com "falta WebRTC". A versão tem que bater exatamente com a do wry (2.0.2),
# senão o trait `WebViewExt` não se aplica ao `WebView` dele.
[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd"))'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }

[lib]
name = "distorrent_lib"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "lib"]

[features]
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]

# Release enxuto: remove símbolos do binário/lib nativos — corte grande no APK
# (o .so ficava ~23 MB "not stripped"; sem símbolos fica bem menor) e também
# no binário desktop. Não altera comportamento em runtime.
[profile.release]
strip = true
